[package]
name = "nu_plugin_ds"
version = "0.1.1"
edition = "2024"
description = "A nushell plugin for talking to the DeepSeek API"
license = "MIT"

[lib]
name = "nu_plugin_ds"
path = "src/lib.rs"

[[bin]]
name = "nu_plugin_ds"
path = "src/main.rs"

[dependencies]
nu-plugin = "0.114.1"
nu-protocol = "0.114.1"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
dirs = "6"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "net",
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
] }
